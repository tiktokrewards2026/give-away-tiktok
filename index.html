<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TikTok Official Giveaway</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #fcdce1;
      text-align: center;
    }

    .topbar {
      background: #c8ceee;
      color: white;
      padding: 15px;
      font-weight: bold;
    }

    .box {
      margin-top: 40px;
      background: linear-gradient(120deg, #ff9a9e 0%, #fecfef 21%, #a1c4fd 100%);
      padding: 20px;
      width: 90%;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    img {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }

    .btn {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      background: #9babbe;
      color: ced1f8;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="topbar">
    TikTok Official Giveaway Center
  </div>

  <div class="box" id="content">
    <h2>Verifying winner...</h2>
    <p>Please wait while we confirm your reward</p>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById("content").innerHTML = `
        <h1>🎉 HAHA PENDEK 🤡</h1>
        <p>BOUKEM SIHH</p>

        <img src="https://i.imgflip.com/1ur9b0.jpg" width="300">

        <button class="btn" onclick="alert('BUAHAHAHA 🤡  PPEK')">
          Claim Reward
        </button>
      `;
    }, 3000);
  </script>

</body>
</html>
